name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight install: only what unit tests need.
          # Heavy/optional deps (ffpb, sentry-sdk, calculation, gps-anomaly-detector)
          # are stubbed in tests/conftest.py.
          python -m pip install \
            pytest pytest-cov \
            ruff \
            requests "urllib3>=2.2.2" "certifi>=2024.7.4" "idna>=3.7" \
            "charset-normalizer>=3.3.2" attrs jsonschema pyrsistent \
            python-dateutil colorama tqdm typing-extensions six \
            piexif ExifRead pynmea2 gpxpy Shapely tzwhere \
            "construct>=2.10.0,<3.0.0"

      - name: Lint (ruff)
        run: ruff check mapilio_kit tests
        continue-on-error: true

      - name: Run tests
        run: pytest --cov=mapilio_kit --cov-report=term-missing
